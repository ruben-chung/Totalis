[project]
name = "rfqbot"
version = "0.1.0"
description = "Polymarket Combos RFQ paper-trading bot: listener, pricing, inventory, backtest"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13,<16",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42",   # Kalshi request signing (RSA-PSS / Ed25519)
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
rfqbot = "rfqbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfqbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
